name: poll
on:
  schedule:
    # GitHub drops and delays scheduled runs, so this only needs to fire now and then: each run is a
    # long job that polls every 30 minutes by itself (poller/loop.sh) and the next run queues behind it.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "loop (default), or a single round: fast, slow or all"
        default: loop
concurrency:
  group: poll-loop
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poller/requirements.txt
      - run: pip install -r poller/requirements.txt
      - name: Install Claude Code (only when credentials exist)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; then npm install -g @anthropic-ai/claude-code >/dev/null 2>&1; fi
      - name: Poll
        working-directory: poller
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event.inputs.tier || 'loop' }}
        run: |
          if [ "$MODE" = "loop" ]; then
            ./loop.sh
          else
            python poll.py --tier "$MODE"
            if [ -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; then python ai_score.py --max 60 --days 3 --workers 2; fi
          fi
